[project]
name = "sec-filing"
version = "0.1.0"
description = "Local CLI MVP for fetching SEC 10-K filings"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2.3",
    "rich>=13.7",
    "structlog>=24",
    "typer>=0.12",
    "weasyprint>=61",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/k10fetcher"]

[project.scripts]
k10fetcher = "k10fetcher.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
